<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nightingale Beacon Suite</title>
<meta name="description" content="18 free single-file learning games + a walkable campus hub for Nightingale College students.">
<meta name="theme-color" content="#0e1b3a">
<!-- Canonical entry point. Redirects to the student Campus Hub. -->
<meta http-equiv="refresh" content="0; url=02_hub/index.html">
<link rel="canonical" href="02_hub/index.html">
<style>
  html,body{margin:0;height:100%;background:linear-gradient(180deg,#0e1b3a,#06102a);
    color:#f4f1e8;font-family:Georgia,'Times New Roman',serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .wrap{padding:24px}
  .lamp{font-size:64px;color:#f4c45a;text-shadow:0 0 30px rgba(244,196,90,.6);
    animation:glow 2.4s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.75}50%{opacity:1}}
  h1{font-size:24px;letter-spacing:1px;color:#f4c45a;margin:14px 0 4px;font-weight:900}
  p{color:#c8d2e6;font-size:14px;margin:4px 0 18px}
  .spin{width:26px;height:26px;margin:0 auto 16px;border:3px solid rgba(244,196,90,.25);
    border-top-color:#f4c45a;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  a{display:inline-block;background:#f4c45a;color:#0e1b3a;text-decoration:none;
    font-weight:700;padding:10px 18px;border-radius:6px;font-size:14px}
  a:hover{background:#ffd700}
</style>
</head>
<body>
  <div class="wrap">
    <div class="lamp">🪔</div>
    <h1>Nightingale Beacon Suite</h1>
    <p>Loading the Campus Hub…</p>
    <div class="spin"></div>
    <a href="02_hub/index.html">Enter the Hub →</a>
  </div>
  <script>
    // Belt-and-suspenders redirect in case meta-refresh is blocked.
    setTimeout(function(){ location.replace('02_hub/index.html'); }, 250);
  </script>
</body>
</html>
